[package]
name = "app"
version = "1.0.1"
description = "A Tauri App"
authors = ["you"]
license-file = "../LICENSE"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
sysinfo = "0.33"
arboard = "3.4"
rdev = "0.5"
windows = { version = "0.57", features = ["Foundation", "Media_Control", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading"] }
