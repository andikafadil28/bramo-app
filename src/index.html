<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRAMO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Wajib transparent biar background window tembus pandang */
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      user-select: none;
      font-family: monospace;
    }

    .capsule-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Kapsul Top Bar BRAMO */
    .bramo-capsule {
      width: 320px;
      height: 48px;
      background: rgba(13, 17, 23, 0.95);
      border: 1.5px solid #00f0ff;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00f0ff;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
      cursor: grab;
    }
  </style>
</head>
<body>
  <div class="capsule-wrapper">
    <!-- Atribut data-tauri-drag-region bikin kapsul bisa ditarik/digeser pake mouse -->
    <div class="bramo-capsule" data-tauri-drag-region>
      [ ⊙ &nbsp; ⊙ ] &nbsp; BRAMO ONLINE
    </div>
  </div>
</body>
</html>
